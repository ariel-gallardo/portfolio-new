<section id="projects" class="projects-container" data-aos="fade-up">
  <h2>My Projects</h2>
  <div class="project-cards">
    <mat-card *ngFor="let project of projects; let i = index" data-aos="fade-up" [attr.data-aos-delay]="i * 100">
      <img mat-card-image [src]="project.imageUrl" alt="Photo of a project">
      <mat-card-header>
        <mat-card-title>{{ project.title }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p>{{ project.description }}</p>
        <mat-chip-listbox aria-label="Project technologies">
          <mat-chip *ngFor="let tech of project.technologies">{{ tech }}</mat-chip>
        </mat-chip-listbox>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button>Live Demo</button>
        <button mat-button>Source Code</button>
      </mat-card-actions>
    </mat-card>
  </div>
</section>
